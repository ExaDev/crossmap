# The allowlist the cargo-deny check enforces, after trilean's: a crate not listed under [bans] allow fails the check, so adding a dependency is a reviewed change to this file with the reason it is needed. The workspace's own crates are listed too, since cargo-deny applies the allowlist to every crate in the graph.

[graph]
all-features = true

[advisories]
# A published advisory against any crate in the graph fails the check. There is no ignore list: an advisory is fixed by updating or replacing the crate, or recorded here with its id and a reason.
ignore = []

[licenses]
# Only permissive licences, so nothing in the graph restricts how the crates are redistributed. A licence that no crate in the graph uses fails the check, so this list is the set in use.
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# A workspace crate depends on a sibling by path, which the wildcard check would otherwise reject.
allow-wildcard-paths = true

allow = [
