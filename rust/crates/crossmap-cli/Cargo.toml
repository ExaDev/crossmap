[package]
name = "crossmap-cli"
description = "The crossmap command: applies a crosswalk to JSON documents read from files, standard input or URLs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../../README.md"
keywords = ["crosswalk", "codec", "json", "cli"]
categories = ["command-line-utilities", "encoding"]

[lib]
name = "crossmap_cli"
path = "src/lib.rs"

[[bin]]
name = "crossmap"
path = "src/main.rs"
required-features = ["read"]

[dependencies]
base64 = { workspace = true, optional = true }
crossmap.workspace = true
percent-encoding = { workspace = true, optional = true }
serde_json.workspace = true
ureq = { workspace = true, optional = true }

[features]
default = ["read"]
# The native reader of files, standard input and URLs. Without it the crate is the command's two pure steps, which
# compile to wasm32-unknown-unknown for a host that does its own reading (the npm package's Node shim).
read = ["dep:base64", "dep:percent-encoding", "dep:ureq"]

[lints]
workspace = true
