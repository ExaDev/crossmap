[workspace]
resolver = "2"
members = [
    "bindings/crossmap-py",
    "bindings/crossmap-wasm",
    "crates/crossmap",
    "crates/crossmap-cli",
    "tests/crossmap-conformance",
    "xtask",
]

[workspace.package]
version = "0.12.5"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/ExaDev/crossmap"

[workspace.dependencies]
# A published crate's requirement on its sibling carries the release version, which crates.io resolves the dependency by; scripts/release-version.py writes it with the workspace version.
crossmap = { path = "crates/crossmap", version = "=0.12.5" }
# Without its native reader, which only the binary and the conformance runner turn on: the wasm binding uses the
# command's pure steps and leaves the reading to its host.
crossmap-cli = { path = "crates/crossmap-cli", version = "=0.12.5", default-features = false }
# trilean's predicate trees, their reading and their three-valued evaluator, and the ordered JSON value they are read from, published as trilean-eval and trilean-json-shape and imported under their old names.
json-shape = { package = "trilean-json-shape", version = "3.0.0" }
trilean = { package = "trilean-eval", version = "3.0.0" }
# `float_roundtrip` makes a number literal read as the nearest double, as `JSON.parse` reads it. `raw_value` lets the ordered value's `Serialize` write a number as the text `JSON.stringify` writes. Both as trilean's workspace sets them.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
serde = "1"
thiserror = "2"
proptest = { version = "1", default-features = false, features = ["std"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.23"
# Without its default features, which pull in the futures crates the binding does not use. As trilean's workspace
# sets it.
js-sys = { version = "0.3.106", default-features = false }
wasm-bindgen = "0.2.129"
# `abi3-py311` builds one wheel against the stable ABI of CPython 3.11, the oldest CPython still supported upstream, so
# it installs on that and every later CPython.
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
percent-encoding = "2"
# Test only: the JSON Schema 2020-12 validator the conformance runner checks documents against the published schema with. Without its default features, which fetch remote references over HTTP and read them from files; the runner registers trilean's schema itself.
jsonschema = { version = "0.61", default-features = false }

[workspace.lints.rust]
# `deny` and not `forbid`, because the wasm binding's generated FFI allows it locally; the library crates forbid it
# with `#![forbid(unsafe_code)]` in their own roots.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
