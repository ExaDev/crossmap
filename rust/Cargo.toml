[workspace]
resolver = "2"
members = [
    "bindings/crossmap-wasm",
    "crates/crossmap",
    "crates/crossmap-cli",
    "tests/crossmap-conformance",
    "xtask",
]

[workspace.package]
version = "0.11.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/ExaDev/crossmap"

[workspace.dependencies]
crossmap = { path = "crates/crossmap" }
# Without its native reader, which only the binary and the conformance runner turn on: the wasm binding uses the
# command's pure steps and leaves the reading to its host.
crossmap-cli = { path = "crates/crossmap-cli", default-features = false }
# trilean's predicate trees, their reading and their three-valued evaluator, and the ordered JSON value they are read from. These are path dependencies on the trilean repository's working tree while its Rust evaluator is under review, and become crates.io versions once it is published.
json-shape = { path = "../../../trilean-worktrees/rust-predicate-evaluator/rust/crates/json-shape" }
trilean = { path = "../../../trilean-worktrees/rust-predicate-evaluator/rust/crates/trilean" }
# `float_roundtrip` makes a number literal read as the nearest double, as `JSON.parse` reads it. `raw_value` lets the ordered value's `Serialize` write a number as the text `JSON.stringify` writes. Both as trilean's workspace sets them.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
serde = "1"
thiserror = "2"
proptest = { version = "1", default-features = false, features = ["std"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.23"
# Without its default features, which pull in the futures crates the binding does not use. As trilean's workspace
# sets it.
js-sys = { version = "0.3.106", default-features = false }
wasm-bindgen = "0.2.129"
percent-encoding = "2"

[workspace.lints.rust]
# `deny` and not `forbid`, because the wasm binding's generated FFI allows it locally; the library crates forbid it
# with `#![forbid(unsafe_code)]` in their own roots.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
