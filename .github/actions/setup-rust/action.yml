name: Set up Rust
description: Installs the toolchain rust/rust-toolchain.toml pins (with the wasm target it lists), restores the cargo cache, optionally installs the wasm-bindgen command line tool at the version rust/Cargo.lock pins. Every job that runs cargo uses it, so the toolchain and the tools are named in one place. Requires checkout before use.

inputs:
  wasm-bindgen:
    description: Whether to install the wasm-bindgen command line tool, which only the npm package's build runs.
    required: false
    default: 'false'

  cache-targets:
    description: Whether the cache holds the build output (`target`). A job that compiles inside a manylinux or musllinux container sets it to false, because build-script binaries the cache restored from a host build need a newer libc than the container has.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      working-directory: rust
      run: rustup toolchain install

    # The cache holds the registry, the build output and the binaries cargo installs, so wasm-bindgen is installed once for a given lock file and found again afterwards.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: rust
        cache-targets: ${{ inputs.cache-targets }}

    # The command line tool and the wasm-bindgen library the glue is generated for must be the same version, so the version is read from the lock file, never written here.
    - name: Install wasm-bindgen at the locked version
      if: inputs.wasm-bindgen == 'true'
      shell: bash
      run: sh scripts/rust.sh install-wasm-bindgen
